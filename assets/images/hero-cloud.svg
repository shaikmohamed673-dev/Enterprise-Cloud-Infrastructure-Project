<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="glowCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glows -->
  <circle cx="300" cy="225" r="180" fill="url(#glowCircle)"/>
  <circle cx="150" cy="120" r="80" fill="#6366f1" fill-opacity="0.15"/>
  <circle cx="450" cy="320" r="90" fill="#06b6d4" fill-opacity="0.12"/>

  <!-- Network Connecting Lines -->
  <path d="M 120 280 L 220 180 L 380 180 L 480 280 L 300 350 Z" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 220 180 L 300 240 L 380 180" stroke="#4f46e5" stroke-width="2" opacity="0.6"/>
  <path d="M 120 280 L 300 240 L 480 280" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>

  <!-- Cloud Base Card Container -->
  <rect x="180" y="110" width="240" height="150" rx="20" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>

  <!-- Cloud Main Icon -->
  <g transform="translate(235, 135)">
    <path d="M 35 75 A 25 25 0 0 1 20 30 A 35 35 0 0 1 80 15 A 45 45 0 0 1 125 45 A 28 28 0 0 1 120 75 Z" fill="url(#accentGrad)" filter="url(#neonGlow)"/>
    <path d="M 45 70 L 115 70" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Edge Nodes / Orbiting Pods -->
  <!-- Node 1: S3 Bucket / Storage -->
  <g transform="translate(70, 240)">
    <rect width="100" height="70" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="25" cy="25" r="8" fill="#0284c7" fill-opacity="0.3"/>
    <path d="M 21 25 L 29 25 M 25 21 L 25 29" stroke="#38bdf8" stroke-width="2"/>
    <text x="38" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">AWS S3</text>
    <text x="18" y="52" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Origin Bucket</text>
    <circle cx="85" cy="20" r="4" fill="#22c55e"/>
  </g>

  <!-- Node 2: CloudFront CDN -->
  <g transform="translate(430, 240)">
    <rect width="110" height="70" rx="12" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="25" cy="25" r="8" fill="#9333ea" fill-opacity="0.3"/>
    <path d="M 20 25 A 5 5 0 1 1 30 25" stroke="#c084fc" stroke-width="2"/>
    <text x="38" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">CloudFront</text>
    <text x="18" y="52" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Global CDN 300+</text>
    <circle cx="95" cy="20" r="4" fill="#22c55e"/>
  </g>

  <!-- Node 3: GitHub Actions CI/CD -->
  <g transform="translate(225, 290)">
    <rect width="150" height="65" rx="12" fill="#0f172a" stroke="#6366f1" stroke-width="1.5"/>
    <circle cx="26" cy="32" r="10" fill="#4f46e5" fill-opacity="0.3"/>
    <path d="M 22 32 L 25 35 L 31 29" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="44" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">GitHub Actions</text>
    <text x="44" y="46" font-family="system-ui, sans-serif" font-size="9" fill="#34d399">CI/CD Pipeline: Active</text>
  </g>

  <!-- Node 4: SSL Security Shield Badge -->
  <g transform="translate(230, 40)">
    <rect width="140" height="38" rx="19" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
    <circle cx="22" cy="19" r="6" fill="#15803d" fill-opacity="0.4"/>
    <path d="M 19 19 L 21 21 L 26 17" stroke="#4ade80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="36" y="23" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">SSL 256-bit TLS</text>
  </g>

  <!-- Floating Stats Chip 1 -->
  <g transform="translate(60, 90)">
    <rect width="110" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">UPTIME SLA</text>
    <text x="12" y="34" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#22c55e">99.99%</text>
  </g>

  <!-- Floating Stats Chip 2 -->
  <g transform="translate(440, 90)">
    <rect width="110" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="18" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">EDGE LATENCY</text>
    <text x="12" y="34" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">28 ms</text>
  </g>
</svg>
