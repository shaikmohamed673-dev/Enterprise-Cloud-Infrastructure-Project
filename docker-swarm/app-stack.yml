version: "3.8"

# ==============================================================================
# Enterprise Cloud Production Application Stack
# ==============================================================================

networks:
  frontend-net:
    driver: overlay
    attachable: true
  backend-net:
    driver: overlay
    attachable: true
  monitoring-net:
    external: true

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

services:
  # ----------------------------------------------------------------------------
  # 1. Reverse Proxy Ingress (Nginx)
  # ----------------------------------------------------------------------------
  nginx-proxy:
    image: nginx:1.25-alpine
    ports:
      - target: 80
        published: 80
        mode: ingress
    configs:
      - source: nginx_config
        target: /etc/nginx/nginx.conf
    networks:
      - frontend-net
    depends_on:
      - api
    deploy:
      mode: replicated
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M

  # ----------------------------------------------------------------------------
  # 2. Application API Microservice
  # ----------------------------------------------------------------------------
  api:
    image: ${APP_IMAGE:-enterprise-cloud-api:latest}
    environment:
      - ENVIRONMENT=production
      - PORT=8000
      - REDIS_HOST=redis
      - DB_HOST=postgres
      - DB_USER=enterprise_user
      - DB_PASSWORD_FILE=/run/secrets/db_password
    networks:
      - frontend-net
      - backend-net
      - monitoring-net
    secrets:
      - db_password
    deploy:
      mode: replicated
      replicas: 3
      placement:
        constraints:
          - node.role == worker
      update_config:
        parallelism: 1
        delay: 15s
        failure_action: rollback
        monitor: 15s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ----------------------------------------------------------------------------
  # 3. Cache & Session Store (Redis)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    networks:
      - backend-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
        reservations:
          cpus: "0.10"
          memory: 128M

  # ----------------------------------------------------------------------------
  # 4. Relational Database (PostgreSQL)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=enterprise_db
      - POSTGRES_USER=enterprise_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    secrets:
      - db_password
    networks:
      - backend-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enterprise_user -d enterprise_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 5. Swarm Cluster Visualizer
  # ----------------------------------------------------------------------------
  visualizer:
    image: dockersamples/visualizer:stable
    ports:
      - "8088:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - frontend-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

configs:
  nginx_config:
    file: ../app/nginx/nginx.conf

secrets:
  db_password:
    external: true
