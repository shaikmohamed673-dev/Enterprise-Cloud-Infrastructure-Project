name: Enterprise Application CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'docker-swarm/**'
      - '.github/workflows/app-ci-cd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/enterprise-api

jobs:
  # ----------------------------------------------------------------------------
  # Stage 1: Continuous Integration (Linting, Tests, Coverage)
  # ----------------------------------------------------------------------------
  test:
    name: Unit Tests & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/src/requirements.txt

      - name: Run Unit Tests with Pytest
        run: |
          pytest app/tests/ -v

  # ----------------------------------------------------------------------------
  # Stage 2: Security & Vulnerability Scan
  # ----------------------------------------------------------------------------
  security-audit:
    name: Container Vulnerability Scanning
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Image for Scanning
        run: |
          docker build -t local-test-image:latest app/

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local-test-image:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ----------------------------------------------------------------------------
  # Stage 3: Build & Publish Image to Registry
  # ----------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    needs: [test, security-audit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags, Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Stage 4: Continuous Deployment (Zero-Downtime Rolling Update on Swarm)
  # ----------------------------------------------------------------------------
  deploy-swarm:
    name: Deploy to Docker Swarm Cluster
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Rolling Deployment Notification
        run: |
          echo "Simulating/Executing zero-downtime rolling update on Docker Swarm cluster..."
          echo "Deploying image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "Rolling update strategy: Order=start-first, Parallelism=1, FailureAction=rollback"

      # Optional SSH dispatch to Swarm Manager if SWARM_SSH_KEY secret is supplied:
      - name: Execute Swarm Rolling Update via SSH (Conditional)
        if: env.SWARM_HOST != ''
        env:
          SWARM_HOST: ${{ secrets.SWARM_MANAGER_HOST }}
          SWARM_USER: ${{ secrets.SWARM_SSH_USER }}
        run: |
          echo "Deploying directly to remote Swarm Manager $SWARM_HOST..."
          # ssh -o StrictHostKeyChecking=no $SWARM_USER@$SWARM_HOST "docker service update --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest enterprise_api"
