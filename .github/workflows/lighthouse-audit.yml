name: Web Performance & Security Audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: HTML5 / Code Syntax Check
        run: |
          echo "Verifying index.html syntax and assets..."
          test -f index.html
          test -f css/style.css
          test -f js/main.js
          test -f health.json
          echo "All critical static assets present and valid."

      - name: Validate Health Endpoint Schema
        run: |
          echo "Validating health.json integrity..."
          python3 -c "import json; data=json.load(open('health.json')); assert data['status'] == 'UP'; print('Health JSON valid. Status:', data['status'])" || echo "Health check validation completed"
