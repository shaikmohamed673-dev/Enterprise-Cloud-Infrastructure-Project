name: Terraform Infrastructure CI

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-lint-and-validate:
    name: Lint, Validate & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/

      - name: Terraform Init (Staging Validation)
        run: |
          cd terraform/environments/staging
          terraform init -backend=false

      - name: Terraform Validate (Staging)
        run: |
          cd terraform/environments/staging
          terraform validate

      - name: Terraform Init (Production Validation)
        run: |
          cd terraform/environments/prod
          terraform init -backend=false

      - name: Terraform Validate (Production)
        run: |
          cd terraform/environments/prod
          terraform validate

      - name: Run Trivy IaC Security Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'terraform/'
          format: 'table'
          exit-code: '0' # Non-blocking for informational report
          severity: 'CRITICAL,HIGH'
