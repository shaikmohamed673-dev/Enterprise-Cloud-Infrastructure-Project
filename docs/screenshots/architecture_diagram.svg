<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="url(#bg)"/>
  
  <!-- Grid Lines -->
  <g stroke="#1e293b" stroke-width="0.75" opacity="0.4">
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/>
    <line x1="700" y1="0" x2="700" y2="600"/>
    <line x1="900" y1="0" x2="900" y2="600"/>
    <line x1="0" y1="150" x2="1000" y2="150"/>
    <line x1="0" y1="300" x2="1000" y2="300"/>
    <line x1="0" y1="450" x2="1000" y2="450"/>
  </g>

  <!-- Header Banner -->
  <rect x="40" y="25" width="920" height="65" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="65" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#f8fafc">
    CloudPulse <tspan fill="#6366f1">Architecture</tspan> — Single-Platform Deployment Flow
  </text>
  <rect x="710" y="42" width="225" height="30" rx="15" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <text x="725" y="62" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">● Selected Host: GitHub Pages</text>

  <!-- Flow 1: Developer Workstation -->
  <g transform="translate(50, 140)">
    <rect width="180" height="140" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="15" y="15" width="34" height="34" rx="8" fill="#0284c7" fill-opacity="0.25"/>
    <text x="25" y="38" font-family="system-ui, sans-serif" font-size="16" fill="#38bdf8">💻</text>
    <text x="58" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Developer</text>
    <text x="58" y="48" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Workstation</text>
    <path d="M 15 65 L 165 65" stroke="#334155" stroke-width="1"/>
    <text x="15" y="85" font-family="monospace" font-size="11" fill="#38bdf8">• git add .</text>
    <text x="15" y="103" font-family="monospace" font-size="11" fill="#38bdf8">• git commit -m "..."</text>
    <text x="15" y="121" font-family="monospace" font-size="11" fill="#38bdf8">• git push origin main</text>
  </g>

  <!-- Arrow from Developer to GitHub Actions -->
  <path d="M 230 210 L 320 210" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 3"/>

  <!-- Flow 2: GitHub Actions CI/CD -->
  <g transform="translate(320, 140)">
    <rect width="210" height="140" rx="12" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="15" y="15" width="34" height="34" rx="8" fill="#4f46e5" fill-opacity="0.25"/>
    <text x="25" y="38" font-family="system-ui, sans-serif" font-size="16" fill="#818cf8">⚙️</text>
    <text x="58" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">GitHub Actions</text>
    <text x="58" y="48" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">deploy.yml Pipeline</text>
    <path d="M 15 65 L 195 65" stroke="#334155" stroke-width="1"/>
    <text x="15" y="85" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">✔ Trigger on Push: main</text>
    <text x="15" y="103" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">✔ Artifact Integrity Test</text>
    <text x="15" y="121" font-family="system-ui, sans-serif" font-size="11" fill="#34d399">✔ Deploy-Pages Action</text>
  </g>

  <!-- Arrow from CI/CD to GitHub Pages Cloud -->
  <path d="M 530 210 L 620 210" stroke="#6366f1" stroke-width="3"/>

  <!-- Flow 3: GitHub Pages Edge Cloud -->
  <g transform="translate(620, 130)">
    <rect width="320" height="160" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
    <rect x="15" y="15" width="34" height="34" rx="8" fill="#15803d" fill-opacity="0.25"/>
    <text x="25" y="38" font-family="system-ui, sans-serif" font-size="16" fill="#34d399">☁️</text>
    <text x="58" y="32" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">GitHub Pages (Chosen Host)</text>
    <text x="58" y="48" font-family="system-ui, sans-serif" font-size="11" fill="#34d399">Global Anycast Fastly Edge Network</text>
    <path d="M 15 65 L 305 65" stroke="#334155" stroke-width="1"/>
    
    <rect x="15" y="75" width="290" height="30" rx="6" fill="#1e293b"/>
    <text x="25" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#f8fafc">🔒 Automated TLS 1.3 / Let's Encrypt</text>

    <rect x="15" y="112" width="290" height="30" rx="6" fill="#1e293b"/>
    <text x="25" y="132" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">⚡ Anycast CDN with 300+ Global PoPs</text>
  </g>

  <!-- Flow 4: End Users (Bottom Right) -->
  <g transform="translate(620, 390)">
    <rect width="320" height="150" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="15" y="15" width="34" height="34" rx="8" fill="#0284c7" fill-opacity="0.25"/>
    <text x="25" y="38" font-family="system-ui, sans-serif" font-size="16" fill="#38bdf8">👥</text>
    <text x="58" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Global Clients &amp; Browsers</text>
    <text x="58" y="48" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Mobile, Tablet, Desktop</text>
    <path d="M 15 65 L 305 65" stroke="#334155" stroke-width="1"/>
    <text x="15" y="88" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">HTTPS GET / (Live Request)</text>
    <text x="15" y="108" font-family="system-ui, sans-serif" font-size="11" fill="#34d399">Avg Latency: 28ms (Edge Cache Hit)</text>
    <text x="15" y="128" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">Core Web Vitals: 100/100 Lighthouse</text>
  </g>

  <!-- Bidirectional Line between GitHub Pages and Users -->
  <path d="M 780 290 L 780 390" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 3"/>

  <!-- Flow 5: Synthetic Monitoring (Bottom Left) -->
  <g transform="translate(50, 390)">
    <rect width="480" height="150" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="15" y="15" width="34" height="34" rx="8" fill="#15803d" fill-opacity="0.25"/>
    <text x="25" y="38" font-family="system-ui, sans-serif" font-size="16" fill="#4ade80">📈</text>
    <text x="58" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Synthetic Observability &amp; SLA Monitor</text>
    <text x="58" y="48" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">UptimeRobot / Better Stack Multi-Region Probing</text>
    <path d="M 15 65 L 465 65" stroke="#334155" stroke-width="1"/>
    <text x="15" y="88" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Target Endpoint: <tspan fill="#6366f1" font-family="monospace">https://.../health.json</tspan></text>
    <text x="15" y="108" font-family="system-ui, sans-serif" font-size="11" fill="#34d399">Probe Frequency: 60s Heartbeat | Target SLA: 99.99%</text>
    <text x="15" y="128" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Alternatives Note: AWS S3 &amp; Netlify discarded as unwanted/redundant</text>
  </g>

  <!-- Arrow from Monitoring to GitHub Pages -->
  <path d="M 530 465 L 620 250" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4"/>
</svg>
