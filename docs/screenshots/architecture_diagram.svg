<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="flowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="url(#bg)"/>
  
  <!-- Subtle Grid lines -->
  <g stroke="#1e293b" stroke-width="0.75" opacity="0.4">
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/>
    <line x1="700" y1="0" x2="700" y2="600"/>
    <line x1="900" y1="0" x2="900" y2="600"/>
    <line x1="0" y1="150" x2="1000" y2="150"/>
    <line x1="0" y1="300" x2="1000" y2="300"/>
    <line x1="0" y1="450" x2="1000" y2="450"/>
  </g>

  <!-- Header Banner -->
  <rect x="40" y="25" width="920" height="65" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="65" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#f8fafc">
    CloudPulse <tspan fill="#6366f1">Architecture</tspan> &amp; Deployment Pipeline
  </text>
  <rect x="740" y="42" width="195" height="30" rx="15" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <text x="760" y="62" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">● High Availability: 99.99%</text>

  <!-- Flow 1: Developer to Git/CI-CD -->
  <!-- Box: Developer Workstation -->
  <g transform="translate(50, 140)">
    <rect width="170" height="130" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="15" y="15" width="34" height="34" rx="8" fill="#0284c7" fill-opacity="0.25"/>
    <text x="25" y="38" font-family="system-ui, sans-serif" font-size="16" fill="#38bdf8">💻</text>
    <text x="58" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Developer</text>
    <text x="58" y="48" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Local Workstation</text>
    <path d="M 15 65 L 155 65" stroke="#334155" stroke-width="1"/>
    <text x="15" y="85" font-family="monospace" font-size="11" fill="#38bdf8">• git add .</text>
    <text x="15" y="103" font-family="monospace" font-size="11" fill="#38bdf8">• git commit -m "..."</text>
    <text x="15" y="121" font-family="monospace" font-size="11" fill="#38bdf8">• git push origin main</text>
  </g>

  <!-- Arrow to GitHub Actions -->
  <path d="M 220 205 L 290 205" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="6 3"/>

  <!-- Box: Version Control & CI/CD -->
  <g transform="translate(290, 140)">
    <rect width="180" height="130" rx="12" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="15" y="15" width="34" height="34" rx="8" fill="#4f46e5" fill-opacity="0.25"/>
    <text x="25" y="38" font-family="system-ui, sans-serif" font-size="16" fill="#818cf8">⚙️</text>
    <text x="58" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">GitHub Actions</text>
    <text x="58" y="48" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">CI/CD Automation</text>
    <path d="M 15 65 L 165 65" stroke="#334155" stroke-width="1"/>
    <text x="15" y="85" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">✔ HTML/CSS Linter</text>
    <text x="15" y="103" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">✔ Lighthouse Audit</text>
    <text x="15" y="121" font-family="system-ui, sans-serif" font-size="11" fill="#34d399">✔ Deploy Artifacts</text>
  </g>

  <!-- Split Arrow to Cloud Hosting Targets -->
  <path d="M 470 205 L 530 205" stroke="#6366f1" stroke-width="2.5"/>
  <path d="M 530 205 L 530 140 L 560 140" stroke="#6366f1" stroke-width="2.5"/>
  <path d="M 530 205 L 560 205" stroke="#6366f1" stroke-width="2.5"/>
  <path d="M 530 205 L 530 270 L 560 270" stroke="#6366f1" stroke-width="2.5"/>

  <!-- Cloud Platforms Container -->
  <g transform="translate(560, 100)">
    <rect width="210" height="210" rx="14" fill="#0f172a" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Multi-Cloud Storage &amp; Host</text>
    
    <!-- Option A: AWS S3 + OAC -->
    <rect x="15" y="40" width="180" height="46" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="28" y="60" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">AWS S3 Origin Bucket</text>
    <text x="28" y="76" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Origin Access Control (OAC)</text>

    <!-- Option B: GitHub Pages -->
    <rect x="15" y="96" width="180" height="46" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="28" y="116" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">GitHub Pages</text>
    <text x="28" y="132" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Active Live Public Host</text>

    <!-- Option C: Netlify / Cloudflare -->
    <rect x="15" y="152" width="180" height="46" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
    <text x="28" y="172" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#22d3ee">Netlify Static Cloud</text>
    <text x="28" y="188" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Headers &amp; Edge CDN</text>
  </g>

  <!-- Arrow to CloudFront / Edge CDN -->
  <path d="M 770 205 L 820 205" stroke="#a855f7" stroke-width="2.5"/>

  <!-- Box: Global CDN & Security Edge -->
  <g transform="translate(820, 140)">
    <rect width="140" height="130" rx="12" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="15" y="15" width="34" height="34" rx="8" fill="#9333ea" fill-opacity="0.25"/>
    <text x="23" y="38" font-family="system-ui, sans-serif" font-size="16" fill="#c084fc">🌐</text>
    <text x="56" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Global CDN</text>
    <text x="56" y="46" font-family="system-ui, sans-serif" font-size="9" fill="#c084fc">300+ Edge PoPs</text>
    <path d="M 15 62 L 125 62" stroke="#334155" stroke-width="1"/>
    <text x="14" y="80" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">🔒 TLS 1.3 SSL</text>
    <text x="14" y="98" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">⚡ Anycast DNS</text>
    <text x="14" y="116" font-family="system-ui, sans-serif" font-size="10" fill="#34d399">🛡 DDoS Shield</text>
  </g>

  <!-- Bottom Tier: Client Request Flow & Synthetic Monitoring -->
  <!-- Box: Global End-Users -->
  <g transform="translate(820, 410)">
    <rect width="140" height="120" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="35" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">End Users</text>
    <text x="20" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Mobile &amp; Desktop</text>
    <path d="M 15 65 L 125 65" stroke="#334155" stroke-width="1"/>
    <text x="16" y="86" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">HTTPS GET /</text>
    <text x="16" y="106" font-family="system-ui, sans-serif" font-size="11" fill="#34d399">Latency &lt; 30ms</text>
  </g>

  <!-- Bidirectional arrow between CDN and Users -->
  <path d="M 890 270 L 890 410" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6 3"/>

  <!-- Box: Synthetic Monitoring & Alerts -->
  <g transform="translate(290, 410)">
    <rect width="450" height="120" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="20" y="20" width="34" height="34" rx="8" fill="#15803d" fill-opacity="0.25"/>
    <text x="28" y="44" font-family="system-ui, sans-serif" font-size="18" fill="#4ade80">📈</text>
    <text x="65" y="36" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Synthetic Uptime &amp; Observability</text>
    <text x="65" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">UptimeRobot / Better Stack / AWS CloudWatch</text>
    <path d="M 20 68 L 430 68" stroke="#334155" stroke-width="1"/>
    <text x="20" y="92" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Polling Target: <tspan fill="#6366f1" font-family="monospace">https://.../health.json</tspan></text>
    <text x="20" y="110" font-family="system-ui, sans-serif" font-size="11" fill="#34d399">Frequency: 60s Global Heartbeat | Alert Channels: Email &amp; Webhook</text>
  </g>

  <!-- Arrow from Monitoring to Edge -->
  <path d="M 740 470 L 820 470" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Legend / Specs pill -->
  <g transform="translate(50, 440)">
    <rect width="180" height="90" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="15" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">SECURITY &amp; COMPLIANCE</text>
    <text x="15" y="44" font-family="system-ui, sans-serif" font-size="10" fill="#38bdf8">✔ TLS 1.3 Enforced</text>
    <text x="15" y="60" font-family="system-ui, sans-serif" font-size="10" fill="#38bdf8">✔ HSTS max-age=31536000</text>
    <text x="15" y="76" font-family="system-ui, sans-serif" font-size="10" fill="#38bdf8">✔ CSP &amp; X-Frame-Options</text>
  </g>
</svg>
