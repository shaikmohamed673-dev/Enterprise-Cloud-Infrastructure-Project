        <rect x="225" y="25" width="18" height="30" rx="2" fill="#38bdf8"/>
        <rect x="250" y="20" width="18" height="35" rx="2" fill="#38bdf8"/>
        <rect x="275" y="32" width="18" height="23" rx="2" fill="#38bdf8"/>
        <rect x="300" y="14" width="18" height="41" rx="2" fill="#38bdf8"/>
        <rect x="325" y="24" width="18" height="31" rx="2" fill="#38bdf8"/>
        <rect x="350" y="18" width="18" height="37" rx="2" fill="#38bdf8"/>
        <rect x="375" y="26" width="18" height="29" rx="2" fill="#38bdf8"/>
        <rect x="400" y="20" width="18" height="35" rx="2" fill="#38bdf8"/>
        <rect x="425" y="28" width="18" height="27" rx="2" fill="#38bdf8"/>
        <rect x="450" y="12" width="18" height="43" rx="2" fill="#38bdf8"/>
        <rect x="475" y="22" width="18" height="33" rx="2" fill="#38bdf8"/>
        <rect x="500" y="16" width="18" height="39" rx="2" fill="#38bdf8"/>
        <rect x="525" y="25" width="18" height="30" rx="2" fill="#38bdf8"/>
