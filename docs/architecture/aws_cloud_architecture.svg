<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="vpcGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="pubSubGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="privSubGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="680" fill="url(#bgGrad)" rx="12" />

  <!-- Title & Header -->
  <text x="50" y="48" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700">AWS Enterprise Cloud Architecture</text>
  <text x="50" y="74" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Multi-AZ Resilient VPC • Application Load Balancer • Docker Swarm Compute Cluster</text>

  <!-- External Internet & Users -->
  <g transform="translate(50, 110)">
    <rect width="140" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#cardShadow)"/>
    <text x="70" y="34" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Public Internet</text>
    <text x="70" y="54" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">HTTPS Clients</text>
  </g>

  <!-- Arrow to IGW -->
  <path d="M 190 145 L 240 145" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/>

  <!-- Internet Gateway -->
  <g transform="translate(240, 110)">
    <rect width="130" height="70" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="2" filter="url(#cardShadow)"/>
    <text x="65" y="34" fill="#818cf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Internet Gateway</text>
    <text x="65" y="54" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">(IGW)</text>
  </g>

  <!-- AWS VPC Boundary -->
  <rect x="420" y="100" width="640" height="540" rx="14" fill="url(#vpcGrad)" stroke="#6366f1" stroke-width="2" stroke-dasharray="6"/>
  <text x="440" y="128" fill="#818cf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">AWS VPC (10.0.0.0/16) - Multi-AZ Production</text>

  <!-- Public Subnet Area -->
  <rect x="440" y="145" width="600" height="150" rx="10" fill="url(#pubSubGrad)" stroke="#10b981" stroke-width="1.5"/>
  <text x="455" y="170" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Public Subnets (us-east-1a: 10.0.1.0/24 | us-east-1b: 10.0.2.0/24)</text>

  <!-- Application Load Balancer inside Public Subnet -->
  <g transform="translate(460, 190)">
    <rect width="260" height="85" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="2" filter="url(#cardShadow)"/>
    <text x="130" y="32" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Application Load Balancer</text>
    <text x="130" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Port 80/443 SSL Termination</text>
    <text x="130" y="68" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Health Check: /health</text>
  </g>

  <!-- NAT Gateways -->
  <g transform="translate(760, 190)">
    <rect width="260" height="85" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="130" y="32" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Dual NAT Gateways</text>
    <text x="130" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">AZ-1 &amp; AZ-2 Outbound Egress</text>
    <text x="130" y="68" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Elastic IPs Attached</text>
  </g>

  <!-- Private Subnet Area -->
  <rect x="440" y="315" width="600" height="305" rx="10" fill="url(#privSubGrad)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="455" y="340" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Private Isolated Subnets (10.0.11.0/24 &amp; 10.0.12.0/24)</text>

  <!-- Swarm Manager Node -->
  <g transform="translate(460, 360)">
    <rect width="260" height="110" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#cardShadow)"/>
    <text x="130" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Docker Swarm Manager</text>
    <text x="130" y="48" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Raft Consensus Controller</text>
    <text x="130" y="66" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Prometheus &amp; Grafana Stack</text>
    <text x="130" y="84" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Visualizer Web UI (:8088)</text>
  </g>

  <!-- Swarm Worker Auto Scaling Group -->
  <g transform="translate(760, 360)">
    <rect width="260" height="110" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="2" filter="url(#cardShadow)"/>
    <text x="130" y="28" fill="#c084fc" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Swarm Worker ASG</text>
    <text x="130" y="48" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Auto Scaling (Min:2, Max:6)</text>
    <text x="130" y="66" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Target Tracking: CPU 70%</text>
    <text x="130" y="84" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Nginx Ingress + API Replicas</text>
  </g>

  <!-- Internal Services Box -->
  <g transform="translate(460, 490)">
    <rect width="560" height="110" rx="8" fill="#090d16" stroke="#475569" stroke-width="1.5"/>
    <text x="20" y="26" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Internal Overlay Network Mesh (VXLAN Port 4789 / Gossip Port 7946)</text>
    
    <!-- Microservice Box -->
    <rect x="20" y="40" width="160" height="55" rx="6" fill="#1e293b" stroke="#38bdf8"/>
    <text x="100" y="62" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">FastAPI API (3 Replicas)</text>
    <text x="100" y="80" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Port 8000 / Dynamic VIP</text>

    <!-- Redis Box -->
    <rect x="200" y="40" width="160" height="55" rx="6" fill="#1e293b" stroke="#f43f5e"/>
    <text x="280" y="62" fill="#fb7185" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Redis Cache</text>
    <text x="280" y="80" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Port 6379 / Session Store</text>

    <!-- Postgres Box -->
    <rect x="380" y="40" width="160" height="55" rx="6" fill="#1e293b" stroke="#3b82f6"/>
    <text x="460" y="62" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">PostgreSQL Database</text>
    <text x="460" y="80" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Port 5432 / Persistent EBS</text>
  </g>

  <!-- S3 Backup Storage -->
  <g transform="translate(50, 315)">
    <rect width="320" height="150" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2" filter="url(#cardShadow)"/>
    <text x="160" y="36" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">AWS S3 Disaster Recovery</text>
    <text x="160" y="62" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">• AES-256 Server-Side Encryption</text>
    <text x="160" y="82" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">• Versioning &amp; Immutability</text>
    <text x="160" y="102" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">• Glacier Transition Lifecycle</text>
    <text x="160" y="122" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">• Enforced TLS Only Bucket Policy</text>
  </g>

  <!-- AWS Management Services (SSM & CloudWatch) -->
  <g transform="translate(50, 490)">
    <rect width="320" height="130" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="160" y="32" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">AWS Control &amp; Security Plane</text>
    <text x="160" y="56" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">• AWS Systems Manager (SSM) Session Mgr</text>
    <text x="160" y="76" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">• CloudWatch Alarms &amp; Metric Logs</text>
    <text x="160" y="96" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">• Zero Open SSH Ingress Ports Required</text>
  </g>

  <!-- Connecting Lines -->
  <path d="M 370 145 L 460 230" stroke="#10b981" stroke-width="2" stroke-dasharray="4"/>
  <path d="M 590 275 L 590 360" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 590 275 L 890 360" stroke="#a855f7" stroke-width="2"/>
  <path d="M 370 390 L 460 390" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5"/>
</svg>
