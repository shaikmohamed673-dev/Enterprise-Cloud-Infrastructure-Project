<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1000" height="560" fill="url(#bgGrad3)" rx="12" />

  <!-- Header -->
  <text x="50" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700">CI/CD Pipeline &amp; Observability Architecture</text>
  <text x="50" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">GitHub Actions Automation • Trivy Security Scanning • Prometheus &amp; Grafana Observability</text>

  <!-- CI/CD Lane -->
  <g transform="translate(50, 100)">
    <rect width="900" height="190" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow3)"/>
    <text x="25" y="32" fill="#818cf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Continuous Integration &amp; Continuous Deployment (GitHub Actions)</text>

    <!-- Step 1: Git Push -->
    <g transform="translate(25, 55)">
      <rect width="145" height="105" rx="8" fill="#1e293b" stroke="#94a3b8"/>
      <text x="72" y="32" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Git Push / PR</text>
      <text x="72" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Feature Branch</text>
      <text x="72" y="72" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Merge to Main</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 175 105 L 205 105" stroke="#818cf8" stroke-width="2"/>

    <!-- Step 2: Quality & Test -->
    <g transform="translate(205, 55)">
      <rect width="145" height="105" rx="8" fill="#1e293b" stroke="#38bdf8"/>
      <text x="72" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Lint &amp; Unit Tests</text>
      <text x="72" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Python 3.11</text>
      <text x="72" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Pytest Suite</text>
      <text x="72" y="88" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Terraform Validate</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M 355 105 L 385 105" stroke="#818cf8" stroke-width="2"/>

    <!-- Step 3: Security Scan -->
    <g transform="translate(385, 55)">
      <rect width="145" height="105" rx="8" fill="#1e293b" stroke="#f43f5e"/>
      <text x="72" y="32" fill="#fb7185" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Security Scan</text>
      <text x="72" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Trivy Vulnerability</text>
      <text x="72" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Gitleaks Secrets</text>
      <text x="72" y="88" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">CIS Compliance</text>
    </g>

    <!-- Arrow 3 -->
    <path d="M 535 105 L 565 105" stroke="#818cf8" stroke-width="2"/>

    <!-- Step 4: Container Build -->
    <g transform="translate(565, 55)">
      <rect width="145" height="105" rx="8" fill="#1e293b" stroke="#eab308"/>
      <text x="72" y="32" fill="#fde047" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Build &amp; Push</text>
      <text x="72" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Multi-stage Build</text>
      <text x="72" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">GitHub Container Reg</text>
      <text x="72" y="88" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Immutable SHA Tags</text>
    </g>

    <!-- Arrow 4 -->
    <path d="M 715 105 L 745 105" stroke="#818cf8" stroke-width="2"/>

    <!-- Step 5: Rolling Deployment -->
    <g transform="translate(745, 55)">
      <rect width="130" height="105" rx="8" fill="#1e293b" stroke="#10b981"/>
      <text x="65" y="32" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Rolling Deploy</text>
      <text x="65" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Docker Swarm</text>
      <text x="65" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Order: start-first</text>
      <text x="65" y="88" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Auto-Rollback</text>
    </g>
  </g>

  <!-- Observability Lane -->
  <g transform="translate(50, 315)">
    <rect width="900" height="210" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5" filter="url(#shadow3)"/>
    <text x="25" y="32" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Observability &amp; Monitoring Architecture</text>

    <!-- Node & Container Exporters -->
    <g transform="translate(25, 55)">
      <rect width="250" height="130" rx="8" fill="#1e293b" stroke="#38bdf8"/>
      <text x="125" y="30" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Metrics &amp; Log Exporters</text>
      <text x="125" y="55" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">• Node Exporter (CPU, RAM, Disk)</text>
      <text x="125" y="75" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">• cAdvisor (Container Resource Usage)</text>
      <text x="125" y="95" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">• FastAPI (/metrics Prometheus client)</text>
      <text x="125" y="115" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">• Promtail (Docker JSON Log Shipper)</text>
    </g>

    <!-- Scrape Arrow -->
    <path d="M 285 120 L 335 120" stroke="#34d399" stroke-width="2"/>

    <!-- Central Aggregators (Prometheus & Loki) -->
    <g transform="translate(345, 55)">
      <rect width="250" height="130" rx="8" fill="#1e293b" stroke="#eab308"/>
      <text x="125" y="30" fill="#fde047" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Storage &amp; Query Engines</text>
      <text x="125" y="55" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">• Prometheus Time Series DB (TSDB)</text>
      <text x="125" y="75" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">• 15-day Metric Retention Policy</text>
      <text x="125" y="95" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">• Loki Compressed Chunks Log Store</text>
      <text x="125" y="115" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">• Alert Rule Engine (High CPU, Latency)</text>
    </g>

    <!-- Display Arrow -->
    <path d="M 605 120 L 655 120" stroke="#34d399" stroke-width="2"/>

    <!-- Visualization & Alerting (Grafana) -->
    <g transform="translate(665, 55)">
      <rect width="210" height="130" rx="8" fill="#1e293b" stroke="#f43f5e"/>
      <text x="105" y="30" fill="#fb7185" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Grafana Dashboards</text>
      <text x="105" y="55" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">• Cluster &amp; Service Health</text>
      <text x="105" y="75" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">• RED Metrics (Rate, Error, Dur)</text>
      <text x="105" y="95" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">• Host OS Performance</text>
      <text x="105" y="115" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">• Centralized Log Viewer</text>
    </g>
  </g>
</svg>
