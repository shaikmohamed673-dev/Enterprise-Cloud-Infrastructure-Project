<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1000" height="600" fill="url(#bgGrad2)" rx="12" />

  <!-- Header -->
  <text x="50" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Docker Swarm Cluster &amp; Overlay Network Topology</text>
  <text x="50" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Ingress Routing Mesh • Raft Distributed Consensus • Isolated Overlay Networks</text>

  <!-- Ingress Routing Mesh Bar -->
  <rect x="50" y="95" width="900" height="45" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow2)"/>
  <text x="500" y="123" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Swarm Ingress Routing Mesh (Port 80/443 Routing to Any Active Service Replica)</text>

  <!-- Manager Node -->
  <g transform="translate(50, 165)">
    <rect width="280" height="390" rx="10" fill="#0b1329" stroke="#6366f1" stroke-width="2" filter="url(#shadow2)"/>
    <rect x="0" y="0" width="280" height="40" rx="10" fill="#1e1b4b"/>
    <text x="140" y="26" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Swarm Manager Node</text>

    <!-- Manager Services -->
    <g transform="translate(15, 55)">
      <rect width="250" height="55" rx="6" fill="#1e293b" stroke="#818cf8"/>
      <text x="125" y="24" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Raft Consensus Core</text>
      <text x="125" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Port 2377 Cluster Leader</text>
    </g>

    <g transform="translate(15, 125)">
      <rect width="250" height="55" rx="6" fill="#1e293b" stroke="#818cf8"/>
      <text x="125" y="24" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Prometheus Server</text>
      <text x="125" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Port 9090 / TSDB 15d Retention</text>
    </g>

    <g transform="translate(15, 195)">
      <rect width="250" height="55" rx="6" fill="#1e293b" stroke="#818cf8"/>
      <text x="125" y="24" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Grafana Dashboards</text>
      <text x="125" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Port 3000 / Provisioned JSON</text>
    </g>

    <g transform="translate(15, 265)">
      <rect width="250" height="55" rx="6" fill="#1e293b" stroke="#818cf8"/>
      <text x="125" y="24" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Swarm Visualizer UI</text>
      <text x="125" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Port 8088 / Docker Sock Read</text>
    </g>

    <g transform="translate(15, 335)">
      <rect width="250" height="40" rx="6" fill="#0f172a" stroke="#475569"/>
      <text x="125" y="25" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Node Exporter &amp; cAdvisor</text>
    </g>
  </g>

  <!-- Worker Node 1 -->
  <g transform="translate(360, 165)">
    <rect width="280" height="390" rx="10" fill="#0b1329" stroke="#10b981" stroke-width="2" filter="url(#shadow2)"/>
    <rect x="0" y="0" width="280" height="40" rx="10" fill="#064e3b"/>
    <text x="140" y="26" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Swarm Worker Node 01</text>

    <!-- Services on Worker 1 -->
    <g transform="translate(15, 55)">
      <rect width="250" height="55" rx="6" fill="#1e293b" stroke="#34d399"/>
      <text x="125" y="24" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Nginx Ingress Proxy (Replica 1)</text>
      <text x="125" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">frontend-net • Rate Limiter</text>
    </g>

    <g transform="translate(15, 125)">
      <rect width="250" height="55" rx="6" fill="#1e293b" stroke="#38bdf8"/>
      <text x="125" y="24" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">FastAPI API (Replica 1)</text>
      <text x="125" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">frontend-net + backend-net</text>
    </g>

    <g transform="translate(15, 195)">
      <rect width="250" height="55" rx="6" fill="#1e293b" stroke="#38bdf8"/>
      <text x="125" y="24" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">FastAPI API (Replica 2)</text>
      <text x="125" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Rolling Update: start-first</text>
    </g>

    <g transform="translate(15, 265)">
      <rect width="250" height="55" rx="6" fill="#1e293b" stroke="#f43f5e"/>
      <text x="125" y="24" fill="#fda4af" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Redis Cache Instance</text>
      <text x="125" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">backend-net • AOF Persistence</text>
    </g>

    <g transform="translate(15, 335)">
      <rect width="250" height="40" rx="6" fill="#0f172a" stroke="#475569"/>
      <text x="125" y="25" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Node Exporter &amp; cAdvisor</text>
    </g>
  </g>

  <!-- Worker Node 2 -->
  <g transform="translate(670, 165)">
    <rect width="280" height="390" rx="10" fill="#0b1329" stroke="#10b981" stroke-width="2" filter="url(#shadow2)"/>
    <rect x="0" y="0" width="280" height="40" rx="10" fill="#064e3b"/>
    <text x="140" y="26" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Swarm Worker Node 02</text>

    <!-- Services on Worker 2 -->
    <g transform="translate(15, 55)">
      <rect width="250" height="55" rx="6" fill="#1e293b" stroke="#34d399"/>
      <text x="125" y="24" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Nginx Ingress Proxy (Replica 2)</text>
      <text x="125" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">frontend-net • Rate Limiter</text>
    </g>

    <g transform="translate(15, 125)">
      <rect width="250" height="55" rx="6" fill="#1e293b" stroke="#38bdf8"/>
      <text x="125" y="24" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">FastAPI API (Replica 3)</text>
      <text x="125" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">frontend-net + backend-net</text>
    </g>

    <g transform="translate(15, 195)">
      <rect width="250" height="55" rx="6" fill="#1e293b" stroke="#3b82f6"/>
      <text x="125" y="24" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">PostgreSQL Database</text>
      <text x="125" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">backend-net • EBS Persistent Volume</text>
    </g>

    <g transform="translate(15, 265)">
      <rect width="250" height="55" rx="6" fill="#1e293b" stroke="#eab308"/>
      <text x="125" y="24" fill="#fde047" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Promtail Log Shipper</text>
      <text x="125" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Streams logs to Central Loki</text>
    </g>

    <g transform="translate(15, 335)">
      <rect width="250" height="40" rx="6" fill="#0f172a" stroke="#475569"/>
      <text x="125" y="25" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Node Exporter &amp; cAdvisor</text>
    </g>
  </g>
</svg>
